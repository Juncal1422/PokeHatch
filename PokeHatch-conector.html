<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#263e35">
  <title>PokeHatch</title>
  <style>
    :root {
      color-scheme: light;
      font: 16px system-ui, sans-serif;
      color: #243e33;
      background: #eeeeDF
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      box-sizing: border-box
    }

    body.game-loaded {
      display: block;
      padding: 0
    }

    #loader {
      max-width: 620px;
      padding: 24px;
      background: #fffcf0;
      border: 2px solid #53674f;
      box-shadow: 4px 5px #adb39c
    }

    #loader h1 {
      margin: 0 0 12px;
      font-size: 1.3rem
    }

    #loader p {
      margin: 0;
      line-height: 1.5
    }

    #loader.error {
      border-color: #a54c43;
      background: #fff3ef
    }

    #game {
      width: 100%;
      height: 100vh;
      border: 0;
      display: block
    }
  </style>
</head>

<body>
  <div id="loader" role="status" aria-live="polite">
    <h1>Cargando PokeHatch…</h1>
    <p>Conectando con los archivos de la rama <code>develop</code>.</p>
  </div>
  <script>
    (async () => {
      const repo = 'Juncal1422/PokeHatch';
      const loader = document.getElementById('loader');

      function mostrarError(error) {
        loader.classList.add('error');
        const titulo = document.createElement('h1');
        titulo.textContent = 'No se pudo cargar PokeHatch';
        const detalle = document.createElement('p');
        detalle.textContent = error.message;
        loader.replaceChildren(titulo, detalle);
      }

      async function descargar(url, nombre) {
        let respuesta;
        try {
          respuesta = await fetch(url, { cache: 'no-store' });
        } catch {
          throw new Error('El navegador no ha podido acceder a ' + nombre + ' en GitHub.');
        }
        if (!respuesta.ok) throw new Error('HTTP ' + respuesta.status + ' al cargar ' + nombre + ' en develop.');
        return respuesta;
      }

      try {
        const rama = await (await descargar('https://api.github.com/repos/' + repo + '/branches/develop', 'la rama')).json();
        const base = 'https://cdn.jsdelivr.net/gh/' + repo + '@' + rama.commit.sha + '/';
        const htmlUrl = base + 'PokeHatch.html';
        const html = await (await descargar(htmlUrl, 'PokeHatch.html')).text();

        const pagina = new DOMParser().parseFromString(html, 'text/html');
        let head = pagina.querySelector('head');
        if (!head) {
          head = pagina.createElement('head');
          pagina.documentElement.insertBefore(head, pagina.documentElement.firstChild);
        }
        const baseNode = pagina.createElement('base');
        baseNode.href = base;
        head.prepend(baseNode);

        const juego = document.createElement('iframe');
        juego.id = 'game';
        juego.title = 'PokeHatch';
        juego.srcdoc = '<!doctype html>\n' + pagina.documentElement.outerHTML;
        document.body.classList.add('game-loaded');
        document.body.replaceChildren(juego);
      } catch (error) {
        console.error('PokeHatch Connector:', error);
        mostrarError(error);
      }
    })();
  </script>
</body>

</html>
