<!doctype html>
<html lang="es">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#263e35" />
<title>PokeHatch · Guardería Pokémon</title>
<link rel="stylesheet" href="styles/juego.css" />
<header>
    <div class="wrap bar">
        <a href="#criadero" class="brand" aria-label="PokeHatch, ir al criadero">
            <img id="logo" alt="" />Poke<span>Hatch</span>
        </a>
        <div class="headtools">
            <span class="wallet">
                <i class="coin"> </i>
                <b id="wallet">0</b> <span>PokéCoins</span>
            </span>
            <span class="wallet" id="capWallet" hidden title="RestauraChapas">
                <b id="caps">0</b> <i id="capIcon"> </i>
            </span>
            <button data-view="Ajustes" aria-label="Configuración" title="Configuración">
                ⚙
            </button>
        </div>
    </div>
</header>
<div class="navwrap">
    <nav class="wrap" aria-label="Navegación"></nav>
</div>
<main class="wrap" id="main">
    <p id="carga" role="status">Cargando PokeHatch…</p>
    <label id="selectorDatos" hidden>Selecciona la carpeta <b>data</b> del juego para abrir la partida.
        <input id="carpetaDatos" type="file" webkitdirectory multiple /></label>
</main>
<footer class="wrap">
    <b>PokeHatch</b>
    <span>Datos y sprites · PokéAPI</span>
</footer>
<div id="coinToasts" role="log" aria-label="Ganancias de PokéCoins"></div>
<div id="births" role="log" aria-label="Eclosiones"></div>
<div id="toast" role="status"></div>
<dialog id="detail">
    <div id="detailBody"></div>
    <button id="close">Cerrar</button>
</dialog>
<input hidden type="file" id="file" accept=".json,application/json" />
<script src="src/app/inicio.js"></script>

</html>
